networks:
  internalNetwork:
    driver: bridge

services:
  db_postgresql:
    image: pgvector/pgvector:pg16
    container_name: db_postgresql
    restart: unless-stopped
    networks:
      - internalNetwork
    ports:
      - "5432:5432"
    env_file:
      - .env
    volumes:
      - postgresDBVolume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
  cache_redis:
    image: redis:7
    container_name: cache_redis
    restart: unless-stopped
    networks:
      - internalNetwork
  backend_nestjs:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: backend_nestjs
    restart: unless-stopped
    networks:
      - internalNetwork
    env_file:
      - .env
    volumes:
      - ./backend:/app
      - /app/node_modules
      - ./uploads:/app/uploads
    depends_on:
      db_postgresql:
        condition: service_healthy
    command: npm run start:dev

  frontend_nextjs:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: frontend_nextjs
    restart: unless-stopped
    networks:
      - internalNetwork
    env_file:
      - .env
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev

  server_caddy:
    image: caddy:alpine
    container_name: server_caddy
    restart: unless-stopped
    
    networks:
      - internalNetwork
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy/cert.pem:/etc/caddy/cert.pem:ro
      - ./caddy/key.pem:/etc/caddy/key.pem:ro
    depends_on:
      - frontend_nextjs
      - backend_nestjs
  tunnel_cloudflare:
    image: cloudflare/cloudflared:latest
    container_name: tunnel_cloudflare
    restart: unless-stopped
    networks:
      - internalNetwork
    env_file:
      - .env
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN} 

volumes:
    postgresDBVolume:
    caddy_data: