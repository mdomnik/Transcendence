networks:
  internalNetwork:
    driver: bridge

services:
  db_postgresql:
    image: pgvector/pgvector:pg16
    container_name: db_postgresql
    restart: unless-stopped
    networks:
      - internalNetwork
    ports:
      - "5432:5432"
    env_file:
      - database/.env
    volumes:
      - postgresDBVolume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
  cache_redis:
    image: redis:7
    container_name: cache_redis
    restart: unless-stopped
    networks:
      - internalNetwork
  backend_nestjs:
    build: ./backend
    container_name: backend_nestjs
    restart: unless-stopped
    networks:
      - internalNetwork
    env_file:
      - backend/.env
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      db_postgresql:
        condition: service_healthy
    command: npm run start:dev

  frontend_nextjs:
    build: ./frontend
    container_name: frontend_nextjs
    restart: unless-stopped
    networks:
      - internalNetwork
    env_file:
      - frontend/.env
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- -H 0.0.0.0 -p 3000

  server_caddy:
    image: caddy:alpine
    container_name: server_caddy
    restart: unless-stopped
    networks:
      - internalNetwork
    ports:
      - "80:80"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend_nextjs
      - backend_nestjs
  tunnel_cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    restart: unless-stopped
    command: tunnel run
    networks:
      - internalNetwork
    environment:
      - TUNNEL_TOKEN=eyJhIjoiMjc4ZjY2OWNhMzVmYWE3YzM3NGE5ODIzNTMxNDc0M2IiLCJ0IjoiNDE1ODE4ZGMtODVhZS00YjM5LTgwYWMtOWFkYmM3N2UzZWFlIiwicyI6IlpqQm1NR1poTTJVdFpXSm1OaTAwWmpOa0xUZzJOekF0TVRkallUVmtNek14WWpSayJ9
    depends_on:
      - server_caddy
volumes:
    postgresDBVolume:
    caddy_data:
    caddy_config: